services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: garante
      POSTGRES_PASSWORD: garante_dev_only
      POSTGRES_DB: garante_juridico
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garante -d garante_juridico"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
